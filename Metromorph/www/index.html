<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metromorph</title>
<style>
:root{--bg:#0b0b0d;--panel:#131316;--head:#1a1a1e;--field:#0c0c0e;--fg:#e4e4e7;--muted:#7d7d86;--line:#2a2a2f;--track:#232328;--shape:#228b22;--hand:#ffb83b;--hov:#45454c;--sfill:#3a3a41;--opt:#17171b;--cbd:#44444b;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-theme=light]{--bg:#f0f0f2;--panel:#fbfbfc;--head:#e8e8ec;--field:#f4f4f6;--fg:#1a1a1e;--muted:#6a6a73;--line:#d3d3da;--track:#dcdce2;--hov:#a9a9b3;--sfill:#b6b6c0;--opt:#fff;--cbd:#9a9aa5;--hand:#e8920a;color-scheme:light}
.theme{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:5;width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:15px;line-height:1;background:var(--panel);color:var(--muted)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 12px 32px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
canvas{width:100%;aspect-ratio:1;display:block;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.stage{display:grid;gap:10px;min-width:0}
.controls{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;min-width:0}
@media(min-width:860px){main{max-width:1120px;grid-template-columns:minmax(0,1fr) minmax(340px,430px);gap:32px;align-items:center;padding-top:28px}}

/* flat controls */
button,select,input{font:inherit;color:var(--fg)}
button{cursor:pointer;background:var(--field);border:1px solid var(--line);border-radius:2px;padding:5px 12px;color:var(--muted);transition:color .12s,border-color .12s,background .12s}
button:hover{color:var(--fg);border-color:var(--hov)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.transport{display:flex;align-items:stretch;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px}
button.play{width:84px;height:44px;padding:0;color:var(--fg);border:1px solid var(--shape);background:color-mix(in srgb,var(--shape) 22%,transparent);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
button.play:hover{background:color-mix(in srgb,var(--shape) 38%,transparent);border-color:var(--shape)}
.bpmbox{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:2px}
#bpmn{font-size:1.7rem;width:72px;text-align:right;font-weight:300;font-variant-numeric:tabular-nums;border:0;background:transparent;padding:0;-moz-appearance:textfield}
.unit{color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.swatches{display:flex;gap:4px;align-items:center}
input.dot{-webkit-appearance:none;appearance:none;width:22px;height:44px;padding:0;border:1px solid var(--line);border-radius:2px;background:none;cursor:pointer;overflow:hidden;flex:none}
input.dot::-webkit-color-swatch-wrapper{padding:0}
input.dot::-webkit-color-swatch{border:0}
input.dot::-moz-color-swatch{border:0}

.seg{display:flex;flex:1;min-width:0;gap:2px;background:var(--field);border:1px solid var(--line);border-radius:2px;padding:2px}
.seg button{flex:1;min-width:0;border:0;padding:4px 0;font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:transparent}
.seg button.on{background:color-mix(in srgb,var(--shape) 35%,transparent);color:var(--fg)}
.zb{left:46px}
.theme svg{display:block}
#zenhint{display:none;text-align:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);opacity:0;pointer-events:none;transition:opacity .6s}
body.zen #zenhint{display:block}
/* zen mode: only the cycle */
body.zen .controls{display:none}
body.zen .stage{cursor:pointer}
body.zen:not(.playing) #zenhint{opacity:.7}
/* loop brackets on the morph bar */
.mw{position:relative;flex:1;min-width:0;display:flex}
.dim{position:absolute;top:2px;bottom:2px;background:color-mix(in srgb,var(--panel) 62%,transparent);pointer-events:none;border-radius:2px}
#dl{left:0}#dr{right:0}
.br{position:absolute;top:0;bottom:0;width:26px;margin-left:-13px;cursor:ew-resize;touch-action:none;z-index:2}
.br::after{content:"";position:absolute;top:1px;bottom:1px;width:7px;border:2px solid var(--fg);border-radius:1px}
.br.lo::after{left:13px;margin-left:-1px;border-right:0}
.br.hi::after{right:13px;margin-right:-1px;border-left:0}
/* devices */
.card{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.grp{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:0 10px 10px}
.hd{margin:0 -10px 2px;padding:6px 10px;background:var(--head);border-bottom:1px solid var(--line);border-radius:3px 3px 0 0;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:8px;min-height:24px}
.row>label{width:56px;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;flex:none}
.val{width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;flex:none}
.row.sub{padding-left:64px}
.row.sub label{width:auto;min-width:0;flex:0 1 auto;display:flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.02em;text-transform:none;color:var(--muted);cursor:pointer}

/* fields */
.card input[type=number],.card input[type=text],.card select{background:var(--field);border:1px solid var(--line);border-radius:2px;padding:5px 8px;transition:border-color .12s}
.card input[type=number]:hover,.card input[type=text]:hover,.card select:hover{border-color:var(--hov)}
.card input[type=number]:focus,.card input[type=text]:focus,.card select:focus{outline:none;border-color:var(--shape)}
.card input[type=number]{width:56px;text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.card select{-webkit-appearance:none;appearance:none;flex:1;min-width:0;padding-right:28px;cursor:pointer;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%237d7d86' stroke-width='1.4'/></svg>");
 background-repeat:no-repeat;background-position:right 9px center}
.card select option{background:var(--opt);color:var(--fg)}
.card input.pat{flex:1;min-width:0;font-size:1.15rem;letter-spacing:.22em;padding:6px 10px}
#colon{width:30px;height:32px;padding:0;font-size:1rem;line-height:1;flex:none}
.ratio .l{color:var(--c1,var(--shape))}.ratio .c{color:var(--fg)}.ratio .r{color:var(--c2,var(--shape))}
.ratio{font-size:1.3rem;font-weight:300;font-variant-numeric:tabular-nums;color:var(--shape);min-width:76px;text-align:right}

/* sliders: flat bars, filled part, thin handle (Ableton-style) */
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:24px;background:transparent;cursor:pointer;margin:0;--p:50%;--fill:var(--sfill)}
input[type=range]::-webkit-slider-runnable-track{height:20px;border-radius:2px;background:linear-gradient(90deg,var(--fill) var(--p),var(--track) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2px;height:20px;margin:0;border-radius:0;background:var(--thumb,var(--fg));border:0;box-shadow:none}
input[type=range]::-moz-range-track{height:20px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:20px;border-radius:2px;background:var(--fill)}
input[type=range]::-moz-range-thumb{width:2px;height:20px;border:0;border-radius:0;background:var(--thumb,var(--fg))}
input[type=range]:focus-visible{outline:none}
#morph{--fill:color-mix(in srgb,var(--shape) 72%,#000);--thumb:var(--fg)}

/* toggles: small square LEDs */
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:2px;background:var(--field);border:1px solid var(--cbd);position:relative;cursor:pointer;flex:none;margin:0;transition:background .12s,border-color .12s}
input[type=checkbox]:checked{background:var(--shape);border-color:var(--shape)}

/* sound device */
details{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:3px}
summary{cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--head);border-radius:3px}
details[open] summary{border-bottom:1px solid var(--line);border-radius:3px 3px 0 0}
summary::-webkit-details-marker{display:none}
summary::after{content:"\25BE";font-size:11px}
details[open] summary::after{content:"\25B4"}
summary:hover{color:var(--fg)}
details>.body{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.note{margin:18px 16px 28px;text-align:center;font-size:11px;line-height:1.5;color:var(--muted);opacity:.8}
body.zen .note{display:none}
#pre{flex:1;min-width:0;padding:5px 6px;background:var(--field);border:1px solid var(--line);border-radius:2px}
.pb{padding:5px 10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;flex:none}
</style>
</head>
<body>
<button id="zen" class="theme zb" type="button" aria-label="Zen mode: hide or show the menus" title="Zen mode"><svg viewBox="34 -645 532 570" width="17" height="17" fill="currentColor" aria-hidden="true"><path transform="scale(1,-1)" d="M300 204Q300 251 267.0 272.0Q234 293 189 293H167Q142 293 142 312Q142 333 169 333H181Q207 333 230.0 353.5Q253 374 253 401Q253 427 229.0 442.5Q205 458 167 458Q111 458 70 449Q60 447 52.0 447.0Q44 447 39.0 454.0Q34 461 34 468Q34 472 38.0 478.0Q42 484 48 485Q101 498 175 498Q228 498 260.5 471.0Q293 444 293 397Q293 371 277.5 349.5Q262 328 242 320Q253 318 266 314Q318 331 391 384Q531 384 531 204V114Q531 89 511.0 89.0Q491 89 491 114V204Q491 277 462.5 310.5Q434 344 393 344Q356 314 306 289Q340 255 340 204Q340 142 305.0 108.5Q270 75 205 75Q132 75 44 145Q34 153 34 163Q34 170 39.0 176.5Q44 183 52 183Q62 183 75 173Q151 115 197 115Q244 115 272.0 136.5Q300 158 300 204ZM421 645Q442 645 456.5 630.0Q471 615 471 594Q471 574 456.0 559.5Q441 545 421.0 545.0Q401 545 386.0 560.0Q371 575 371.0 595.0Q371 615 386.0 630.0Q401 645 421 645ZM297 590Q314 590 317 568Q319 539 349.0 520.0Q379 501 421.0 501.0Q463 501 492.5 520.0Q522 539 525 568Q528 590 546 590Q554 590 560.0 583.5Q566 577 566 567Q566 522 524.0 491.0Q482 460 421.0 460.0Q360 460 318.0 491.0Q276 522 276 567Q276 590 297 590Z"/></svg></button>
<button id="theme" class="theme" type="button" aria-label="Switch between dark and light mode" title="Dark / light"></button>
<main>
  <div class="stage"><canvas id="wheel" aria-label="Rhythm cycle"></canvas>
  <div id="zenhint">tap the circle to start and stop</div>
  </div>
  <div class="controls">
  <div class="transport">
    <button id="play" class="play" aria-label="Start or stop">Start</button>
    <div class="bpmbox"><input id="bpmn" type="number" min="30" max="300" aria-label="BPM"><span class="unit">bpm</span></div>
    <span class="swatches"><input id="accent" class="dot" type="color" value="#228b22" aria-label="Colour at the start of the morph" title="Colour at the start of the morph"><input id="accent2" class="dot" type="color" value="#d4a017" aria-label="Colour at the end of the morph" title="Colour at the end of the morph"></span>
  </div>
  <div class="card"><details open data-k="rhythm"><summary>Rhythm</summary><div class="body">
  <div class="row"><label for="pat">Pattern</label><input id="pat" class="pat" type="text" inputmode="decimal" autocomplete="off" aria-label="Pattern digits"><button id="colon" type="button" aria-label="Insert colon between two patterns" title="Insert : between two patterns">:</button><span class="ratio" id="ratio" title="steps : total units"></span></div>
  <div class="row"><label for="pre">Preset</label><select id="pre" aria-label="Load a saved preset"></select><button id="psave" class="pb" type="button" title="Save the current pattern and settings as a preset">Save</button><button id="pdel" class="pb" type="button" title="Delete the selected preset">Delete</button></div>
  <div class="row"><label for="morph">Morph</label><div class="mw"><input id="morph" type="range" min="0" max="100" step="0.5"><b class="dim" id="dl"></b><b class="dim" id="dr"></b><i class="br lo" id="bl" title="Loop start (double-tap to reset)"></i><i class="br hi" id="bh" title="Loop end (double-tap to reset)"></i></div><span class="val" id="mv"></span></div>
  <div class="row sub"><label><input id="auto" type="checkbox"> auto</label><input id="secs" type="range" min="1" max="64" step="1" aria-label="Cycles for one morph sweep"><span class="val" id="scv" style="width:66px"></span></div>
  <div class="row sub"><label><input id="sub" type="checkbox"> hear subdivision at the ends of the morph</label></div>
  <div class="row"><label>Division</label><div class="seg" id="swg" role="group" aria-label="Division: subdivisions through the morph"><button type="button" data-v="">Off</button><button type="button" data-v="all" title="All subdivisions: the bigger grid dissolves into the smaller one">All</button><button type="button" data-v="fit" title="Fit: only as many notes as the smaller grid has, shifted along">Fit</button></div></div>
  </div></details>
  <details open data-k="time"><summary>Time</summary><div class="body">
  <div class="row"><label for="bpm">Tempo</label><input id="bpm" type="range" min="30" max="300" step="1"><span class="val" id="tpv"></span></div>
  <div class="row"><label>Cycle</label><input id="num" type="number" min="1" max="64" aria-label="Cycle numerator"><span>/</span><input id="den" type="number" min="1" max="28" aria-label="Cycle denominator"><span class="val" id="cyc" style="width:auto;flex:1;text-align:left"></span></div>
  </div></details>
  <details data-k="sound"><summary>Sound</summary><div class="body">
    <div class="row"><label for="voice">Voice</label><select id="voice" aria-label="Sound"><option value="beep">Beep</option><option value="wood">Wood block</option><option value="cow">Cowbell</option><option value="click">Electronic click</option></select></div>
    <div class="row"><label>Pitch</label><input id="sp" type="range" min="200" max="2000" step="10"><span class="val" id="spv"></span></div>
    <div class="row"><label>Volume</label><input id="svol" type="range" min="0" max="1" step=".05"><span class="val" id="svv"></span></div>
    <div class="row"><label title="Delay the animation to match Bluetooth sound">Sync</label><input id="slag" type="range" min="0" max="600" step="10" aria-label="Animation delay for Bluetooth"><span class="val" id="slv" style="width:56px"></span></div></div></details>
  </div>
  </div>
</main>
<p class="note">An implementation of Malcolm Braff's rhythm plugins. All math was compiled with AI, using the General Theory of Rhythm site.<br>credits: @jassdudek</p>
<script>
var COLS={};   // theme colours read once per theme change, not every frame
function refreshCols(){const css=getComputedStyle(document.documentElement);["--fg","--muted","--line","--hand"].forEach(n=>COLS[n]=css.getPropertyValue(n).trim())}
const themeBtn=document.getElementById("theme");
const ICON_SUN='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>',
 ICON_MOON='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M20.4 14.6A8.6 8.6 0 1 1 9.4 3.6a7 7 0 0 0 11 11z"/></svg>';   // plain one-colour icons, no emoji
function setTheme(t,keep){document.documentElement.dataset.theme=t;refreshCols();themeBtn.innerHTML=t==="light"?ICON_MOON:ICON_SUN;if(keep)try{localStorage.setItem("groove-theme",t)}catch(e){}}
{let t=null;try{t=localStorage.getItem("groove-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";setTheme(t)}
const setZen=on=>{document.body.classList.toggle("zen",on);document.documentElement.classList.toggle("zen",on);refreshCols()};
document.getElementById("zen").onclick=()=>setZen(!document.body.classList.contains("zen"));
document.addEventListener("keydown",e=>{if(e.key==="Escape")setZen(false)});
themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==="light"?"dark":"light",true);
document.querySelectorAll("details[data-k]").forEach(d=>{try{const v=localStorage.getItem("groove-open-"+d.dataset.k);if(v!==null)d.open=v==="1"}catch(e){}d.addEventListener("toggle",()=>{try{localStorage.setItem("groove-open-"+d.dataset.k,d.open?"1":"0")}catch(e){}})});
const S={lo:0,hi:100,bpm:90,morph:100,auto:true,cyc:8,num:1,den:4,accent:"#228b22",accent2:"#d4a017",sound:{pitch:880,pan:0,vol:.8},w:[2,2,3,2,2]};
try{const x=JSON.parse(localStorage.getItem("groove-s7")||"null");if(x&&Array.isArray(x.w)&&x.w.length>=1&&x.w.length<=32)Object.assign(S,x)}catch(e){}
S.num=1;S.den=1;   // the cycle always opens as 1/1 (a whole note), whatever was saved
if(!(S.lo>=0&&S.hi<=100&&S.hi-S.lo>=2)){S.lo=0;S.hi=100}   // loop brackets on the morph bar, in percent
if(S.swing===true)S.swing="all";if(!S.swing)S.swing="";   // swing: "" off, "all" every subdivision, "fit" only as many notes as the smaller grid
const save=()=>{try{localStorage.setItem("groove-s7",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const tri=ph=>{ph%=1;return ph<.5?ph*2:2-ph*2};
let ctx=null,playing=false,timer=null,cycleStart=0,cycleNo=0,uOff=0,cur=null,pi=0,cycles=[],events=[],hits={},fr=0,lastPos=-1;

// Auto morph is counted in cycles: hold one cycle at the start, ramp to the end over N cycles, hold one cycle, ramp back.
// u = position in cycles (cycle number + place inside the cycle). N is the "cycles" slider.
const autoRaw=u=>{const N=S.cyc,H=1,P=2*(N+H);let p=((u%P)+P)%P;if(p<H)return 0;p-=H;if(p<N)return p/N;p-=N;if(p<H)return 1;return 1-(p-H)/N};
const autoM=u=>(S.lo+(S.hi-S.lo)*autoRaw(u))/100;   // auto morph only travels between the two loop brackets
const nowU=()=>{const p=cycles[0];return p?p.k+clamp((ctx.currentTime-p.s)/p.P):0};
const curM=()=>S.auto&&playing&&cycles[0]?autoM(nowU()-uOff):S.morph/100;
const cycDur=()=>240*S.num/(S.den*S.bpm);                                // cycle = num/den of a whole note; BPM counts quarters
// Onset k sits at (1-m)*k/n + m*(units before step k)/(total units). For 22322: 5 steps over 11 units = 5:11.
function buildPlan(cn,mFix){const A=S.w,B=S.w2,n=A.length,on=[];
 const sum=w=>w.reduce((a,b)=>a+b,0),cum=w=>{let c=0;return w.map(x=>{const v=c;c+=x;return v})};
 const mk=u=>mFix!=null?mFix:(S.auto&&playing&&cn!=null?autoM(u-uOff):S.morph/100);   // morph value at cycle position u
 const tA=sum(A),cA=cum(A),tB=B?sum(B):0,cB=B?cum(B):null,c0=cn||0;
 // one pattern: even k/n -> phrased. Two patterns (same step count): phrased A -> phrased B, accents stay constant.
 // Each note takes the morph value of its own moment (two refinement steps), so auto morph glides inside a cycle too.
 for(let k=0;k<n;k++){const from=B?cA[k]/tA:k/n,to=B?cB[k]/tB:cA[k]/tA;let pos=from;for(let it=0;it<2;it++)pos=from+(to-from)*mk(c0+pos);on.push({pos,acc:k===0,i:k})}
 const ev=on.slice(),m=mk(c0+.5);
 // subdivided notes: the unit grid of the pattern sitting at the end of the morph (both ends when morphing pattern to pattern)
 // each subdivided note takes the morph value of its own moment: it sounds (fading in) within the last 15% before an end of the morph
 // swing subdivisions: the notes inside each step travel with the morph, from straight subdivisions of the n-tuplet to the unit grid
 // (single pattern: they fade in from nothing with sin(m*pi/2); pattern to pattern: the j-th note of a step glides from pattern A's place to pattern B's, spare notes fade out (cos) or in (sin))
 const add=(k,f,from,to,g)=>{let pos=from;for(let it=0;it<2;it++)pos=from+(to-from)*mk(c0+pos);const v=g(mk(c0+pos));if(v>.03)ev.push({pos,acc:false,sub:true,g:v})};
 if(S.swing&&(B?Math.max(tA,tB):tA)<=96){
  for(let k=0;k<n;k++){
   if(!B){for(let j=1;j<A[k];j++){const f=j/A[k];add(k,f,(k+f)/n,(cA[k]+j)/tA,m=>Math.sin(m*Math.PI/2))}}
   else if(S.swing==="fit"){   // always as many notes as the smaller grid has: its notes sit on its own grid at one end and are fitted onto the bigger grid at the other

// two colour dots next to the BPM: the accent blends from the first to the second as the morph goes 0 -> 100%
const OKC=c=>/^#[0-9a-f]{6}$/i.test(c);
const mixHex=(a,b,t)=>{const x=[1,3,5].map(i=>parseInt(a.slice(i,i+2),16)),y=[1,3,5].map(i=>parseInt(b.slice(i,i+2),16));return"#"+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,"0")).join("")};
if(!OKC(S.accent))S.accent="#228b22";if(!OKC(S.accent2))S.accent2="#d4a017";
const setCols=()=>{document.documentElement.style.setProperty("--c1",S.accent);document.documentElement.style.setProperty("--c2",S.accent2)};setCols();
$("accent").value=S.accent;$("accent2").value=S.accent2;
$("accent").oninput=e=>{S.accent=e.target.value;setCols();save()};
$("accent2").oninput=e=>{S.accent2=e.target.value;setCols();save()};
const fillBar=el=>el.style.setProperty("--p",((el.value-el.min)/(el.max-el.min)*100)+"%");
const fillAll=()=>document.querySelectorAll("input[type=range]").forEach(fillBar);
document.addEventListener("input",e=>{if(e.target.type==="range")fillBar(e.target)});
fill();syncTop();fillAll();draw();
