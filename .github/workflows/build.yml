name: Build apps
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: Generate app icons
        run: npx @capacitor/assets generate --android --assetPath assets
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Metromorph-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  mac:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - { name: intel, script: "dist:mac-intel" }
          - { name: apple-silicon, script: "dist:mac-arm" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Build unsigned Mac app (${{ matrix.name }})
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Metromorph-mac-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
